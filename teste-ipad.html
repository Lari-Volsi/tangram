<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangram Start - teste de rastros (iPad)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Página TEMPORÁRIA de diagnóstico. Não faz parte do projeto; pode ser apagada depois. -->
    <style id="modo-teste"></style>
    <style>
        .painel-teste { margin-bottom: 10px; font-size: 14px; color: var(--cor-principal); }
        .painel-teste button { padding: 6px 12px; font-size: 14px; min-height: 36px; }
        .painel-teste button.ativo { outline: 3px solid var(--cor-principal); }
    </style>
</head>
<body>
    <div class="container">
        <div class="painel-teste">
            <p><b>Modo do destaque:</b> <span id="modo-nome"></span></p>
            <button data-modo="sem">1. Sem destaque</button>
            <button data-modo="um">2. 1 filtro (novo)</button>
            <button data-modo="oito">3. 8 filtros (antigo)</button>
            <button data-modo="um-sem-arraste">4. 1 filtro, some no arraste</button>
        </div>
        <div id="tangram-caixa">
            <img src="img/A1-01.svg" id="A1" class="tangram-imagem" alt="Peça 1">
            <img src="img/A2-01.svg" id="A2" class="tangram-imagem" alt="Peça 2">
            <img src="img/A3-01.svg" id="A3" class="tangram-imagem" alt="Peça 3">
            <img src="img/A4-01.svg" id="A4" class="tangram-imagem" alt="Peça 4">
            <img src="img/A5-01.svg" id="A5" class="tangram-imagem" alt="Peça 5">
            <img src="img/A6-01.svg" id="A6" class="tangram-imagem" alt="Peça 6">
            <img src="img/A7-01.svg" id="A7" class="tangram-imagem" alt="Peça 7">
        </div>
        <div class="controles">
            <button id="btn-gira-esquerda">↩️ Girar Esquerda</button>
            <button id="btn-alternar-peca">🔄 Mudar cor</button>
            <button id="btn-gira-direita">Girar Direita ↪️</button>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        // Cada modo só sobrescreve o filter da peça selecionada. script.js não é alterado.
        const modos = {
            'sem': ['Sem destaque', '.tangram-imagem.selecionada { filter: none; }'],
            'um': ['1 filtro (o que está no style.css)', ''],
            'oito': ['8 filtros (versão anterior)',
                '.tangram-imagem.selecionada { filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(1.5px 0 0 #284260) drop-shadow(-1.5px 0 0 #284260) drop-shadow(0 1.5px 0 #284260) drop-shadow(0 -1.5px 0 #284260); }'],
            // Durante o arraste o script.js põe cursor: grabbing no style da peça; o seletor usa isso
            'um-sem-arraste': ['1 filtro, removido durante o arraste',
                '.tangram-imagem.selecionada[style*="grabbing"] { filter: none; }']
        };
        function aplicarModo(m) {
            document.getElementById('modo-teste').textContent = modos[m][1];
            document.getElementById('modo-nome').textContent = modos[m][0];
            document.querySelectorAll('.painel-teste button').forEach(b =>
                b.classList.toggle('ativo', b.dataset.modo === m));
        }
        document.querySelectorAll('.painel-teste button').forEach(b =>
            b.addEventListener('click', () => aplicarModo(b.dataset.modo)));
        aplicarModo('um');
    </script>
</body>
</html>
